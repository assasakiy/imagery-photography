services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sopian-lalu-imagery:latest
    container_name: imagery_app
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-${COOLIFY_FQDN:-http://localhost}}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-imagery}
      - DB_USERNAME=${DB_USERNAME:-imagery_user}
      - DB_PASSWORD=${DB_PASSWORD:-imagery_password}
      - CACHE_STORE=database
      - SESSION_DRIVER=database
      - QUEUE_CONNECTION=database
    volumes:
      - ./storage/app:/var/www/html/storage/app
      - ./storage/logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: imagery_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-imagery}
      MYSQL_USER: ${DB_USERNAME:-imagery_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-imagery_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - imagery_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  imagery_mysql_data:
